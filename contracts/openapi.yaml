openapi: 3.1.0
info:
  title: 交我归 Demo API
  version: 0.1.0
  description: 两人共用契约。规则以业务规则基线为唯一来源；字段 snake_case，枚举大写字符串， 时间带时区，ID 为不透明字符串。列表响应统一 items/next_cursor，成功响应直接返回对象本身，
    错误响应统一 code/message/request_id/details。
servers:
- url: http://localhost:8000/api/v1
paths:
  /agent/status:
    get:
      summary: 报告助手可用状态
      description: 动作 agent:use；仅辅导员、思政、学院负责人。未配置模型时返回 enabled=false，不外呼；不返回地址或凭据。
      operationId: get_report_agent_status
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 当前状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStatus'
        '403':
          description: 无动作权限或负责范围未解析
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /agent/reports:
    post:
      summary: 请求受控报告助手
      description: 动作 agent:use，工具执行还校验 statistics:read。每次工具重新校验会话及范围，仅聚合统计；服务端生成有来源的数字，模型不得自行写数字结论。无业务写入/通知，无跨请求聊天存储；审计仅保留工具依据与错误码。默认模型关闭，返回 503 AGENT_UNAVAILABLE。
      operationId: run_report_agent
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRequest'
      responses:
        '200':
          description: 服务端按已查询来源生成的报告草稿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentReport'
        '403':
          description: 未授权或范围未解析
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: AGENT_SCOPE_CHANGED，重新查询前负责范围已变化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 请求字段不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: AGENT_MODEL_ERROR / AGENT_INVALID_RESPONSE / AGENT_TOOL_REJECTED，模型错误或受控工具调用非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: AGENT_UNAVAILABLE，模型未启用或配置不完整
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: AGENT_TIMEOUT / AGENT_LIMIT_REACHED，模型超时或执行达到限额
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # 千人体验仅增加合成账号样例；登录和授权字段兼容，列表仍为既有演示账号数组。
  /auth/demo-accounts:
    get:
      summary: 列出合成登录账号
      responses:
        '200':
          description: 合成体验账号列表；千人场景含各学院负责人、教师和宿管，学生保留代表账号，其余可输入合成登录名。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DemoAccount'
  /auth/mock-login:
    post:
      summary: 模拟学校统一身份登录或工号账号登录
      description: 同一入口按登录名分派：校内统一账户走模拟统一身份（R18）， 园区分发的宿管工号账号走本地工号表校验口令（R19）。 账号被停用时返回 ACCOUNT_DISABLED。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - login_name
              - password
              properties:
                login_name:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: 会话令牌与上下文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: 口令错误或账号不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 账号已被园区停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /me:
    get:
      summary: 当前会话上下文
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 上下文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContext'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/role-switch:
    post:
      summary: 切换到该账号已被授予的另一角色
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - role
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: 新会话令牌（旧令牌立即失效）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '403':
          description: 该账号未被授予此角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      summary: 退出并销毁会话
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 已退出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResult'
  /authz/actions:
    get:
      summary: 当前角色可执行动作
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 动作清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowedActions'
  /authz/scope-check:
    get:
      summary: 检查当前会话对某动作的授权与数据范围
      security:
      - bearerAuth: []
      parameters:
      - name: action
        in: query
        schema:
          type: string
          default: reservation:create
      responses:
        '200':
          description: 允许时返回角色、动作与范围
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopeCheck'
        '403':
          description: 动作未授予或范围无法解析
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /authz/roles:
    get:
      summary: 系统角色枚举列表
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
  /staff-accounts:
    get:
      summary: 列出园区分发的宿管工号账号
      description: 仅园区角色（staff_account:read）。这些账号属雇佣人员，不在学校统一身份目录内（R19）。
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 工号账号列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccountList'
        '403':
          description: 非园区角色一律拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: 注册宿管工号账号并绑定固定管理楼栋
      description: 仅园区角色（staff_account:create）。角色固定为 DORM_MANAGER，楼栋范围即后续该账号的数据范围。 初始口令由服务端生成，只在本响应里返回一次（Demo 默认，见基线「报告、风险和权限默认」）。
        楼栋是否存在由 B 的目录接口校验，目录落地前只校验非空与去重。
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffAccountCreateRequest'
      responses:
        '201':
          description: 已创建，含一次性初始口令
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccountSecret'
        '403':
          description: 非园区角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 登录名已被占用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 楼栋列表为空或字段格式不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /staff-accounts/{staff_account_id}:
    patch:
      summary: 改绑管理楼栋或显示名
      description: 仅园区角色（staff_account:update）。改绑只影响后续会话范围解析，不写历史记录。
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/StaffAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffAccountUpdateRequest'
      responses:
        '200':
          description: 更新后的账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccount'
        '403':
          description: 非园区角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 账号不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /staff-accounts/{staff_account_id}/reset-password:
    post:
      summary: 重置工号账号口令
      description: 仅园区角色（staff_account:reset）。新口令只在本响应返回一次，旧会话立即失效。
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/StaffAccountId'
      responses:
        '200':
          description: 含新口令
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccountSecret'
        '403':
          description: 非园区角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 账号不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /staff-accounts/{staff_account_id}/disable:
    post:
      summary: 停用宿管工号账号
      description: 仅园区角色（staff_account:disable）。停用后登录被拒，已签发会话在下次请求时失效。
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/StaffAccountId'
      responses:
        '200':
          description: 已停用的账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccount'
        '403':
          description: 非园区角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 账号不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /staff-accounts/{staff_account_id}/enable:
    post:
      summary: 启用宿管工号账号
      description: 仅园区角色（staff_account:enable）。把已停用账号恢复为在用，清除停用时间；恢复后可再次登录，楼栋范围沿用账号当前绑定。
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/StaffAccountId'
      responses:
        '200':
          description: 已启用的账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccount'
        '403':
          description: 非园区角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 账号不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reservations:
    get:
      summary: 按授权范围列出预约
      description: 学生返回本人当夜及历史预约；辅导员与宿管在目录关系落地前返回 SCOPE_UNRESOLVED，不得返回空列表伪装成「没有预约」。
      security:
      - bearerAuth: []
      parameters:
      - name: service_date
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: 预约列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationList'
        '403':
          description: 角色未授予 reservation:read，或范围依赖的目录关系未落地
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: 创建当日晚归预约
      description: service_date 由服务端时钟判定为当夜，客户端不可指定其他夜晚（R05）。 全部自动通过（R06）。当夜已存在 ACTIVE/FULFILLED 预约返回 RESERVATION_EXISTS；存在
        CANCELLED 预约返回 RESERVATION_CANCELLED， 须走恢复接口复用同一 ID。 本预约若首次跨过演示配置的规则阈值，响应额外带 risk_notice（R16 的申请时弹窗）； 弹窗只是提示，不改变自动通过的结果，也不产生任何通知任务（R15）。
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - planned_return_at
              properties:
                planned_return_at:
                  type: string
                  format: date-time
                reason:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: 已创建并自动通过；首次跨阈值时带申请弹窗事实
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '409':
          description: 当夜已有预约或需走恢复
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reservations/tonight:
    get:
      summary: 当前业务夜的本人预约（服务端判定 service_date）
      description: 供学生端使用，避免客户端推算业务日；无预约时返回 null。 仅学生角色可用。
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 预约对象或 null
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Reservation'
                - type: 'null'
  /reservations/{reservation_id}:
    patch:
      summary: 改期或修改原因（次数不限）
      description: R07：不受原预约时间窗口约束，可改到本业务夜门禁时段内任意时间； 已返宿（FULFILLED）或业务夜已结束（CLOSED）返回 409 RESERVATION_NOT_EDITABLE。expected_version
        过期返回 409 VERSION_CONFLICT。
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - expected_version
              properties:
                expected_version:
                  type: integer
                planned_return_at:
                  type: string
                  format: date-time
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: 更新后的预约
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          description: 预约不存在或不属于当前范围
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 版本冲突或当前状态不可修改
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reservations/{reservation_id}/cancel:
    post:
      summary: 取消预约
      description: 已返宿（FULFILLED）或业务夜结束（CLOSED）不可取消。取消保留 ID 供恢复。
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - expected_version
              properties:
                expected_version:
                  type: integer
      responses:
        '200':
          description: 取消后的预约
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          description: 预约不存在或不属于当前范围
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 版本冲突或当前状态不可取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reservations/{reservation_id}/restore:
    post:
      summary: 恢复已取消的当夜预约（复用同一 ID）
      description: 基线「取消后恢复同一预约 ID，不能新建第二条」；仅 CANCELLED 可恢复。
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - expected_version
              properties:
                expected_version:
                  type: integer
      responses:
        '200':
          description: 恢复后的预约
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          description: 预约不存在或不属于当前范围
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 版本冲突或当前状态不可恢复
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reservations/{reservation_id}/revisions:
    get:
      summary: 预约修订历史（只追加）
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ReservationId'
      responses:
        '200':
          description: 按 version 升序的修订记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionList'
        '404':
          description: 预约不存在或不属于当前范围
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /risk-events:
    get:
      summary: 按授权范围列出风险事件
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
        '403':
          description: 无权或负责关系缺失
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reports/daily:
    get:
      summary: 授权范围内晚归日报（校级可查看全校）
      description: 校级 AUTH_ADMIN 可查看服务端 scope 内全校学生，学院负责人查看获授学院，负责教师查看明确负责学生；返回指定业务夜的预约事实与按 `reports.summary` 口径算出的计数 （report:read）。缺省看服务端当前时刻的前一晚；传入晚于当前业务日的日期返回
        422。 与 08:30 投递的日报邮件同取数、同口径，两处数字不可能不一致。未确认返宿只是没有匹配到 通行记录，接口不据此生成任何提醒（R15）。负责关系尚未同步时返回 403 `SCOPE_UNRESOLVED`。
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ServiceDate'
      responses:
        '200':
          description: 当夜报告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReport'
        '403':
          description: 无权或负责关系缺失
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 业务日期不可查看
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reports/weekly:
    get:
      summary: 授权范围内晚归周报（校级可查看全校）
      description: report:read 按服务端 scope 授权；校级全校、学院负责人获授学院、负责教师明确负责学生，仅只读。以指定业务夜为末夜，向前覆盖 `weekly_report_nights` 个业务夜（含空夜，逐夜一行）。 计数与投递出去的周报正文同口径；一周内一个预约都没有也返回全零行，不返回空对象。
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ServiceDate'
      responses:
        '200':
          description: 区间报告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyReport'
        '403':
          description: 无权或负责关系缺失
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 业务日期不可查看
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reports/subscriptions:
    put:
      summary: 保存日报周报偏好，风险订阅独立
      operationId: put_reports_subscriptions
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSubscription'
        '403':
          description: 动作、范围或输入被拒
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportSubscription'
      description: 持久化日报/周报订阅；风险投递配置与普通报告偏好独立。
    get:
      summary: 当前用户的报告订阅关系
      description: 持久化日报/周报订阅；风险投递配置与普通报告偏好独立。
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSubscription'
        '403':
          description: 动作、范围或输入被拒
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /buildings/{building_id}/tonight:
    get:
      summary: 宿管当晚名单
      description: 动作 building:tonight 仅授予宿管，且只能命中当前有效值班楼栋（R11）。 每晚 24:00（业务夜 D 的 D+1 00:00）落一份该业务夜的汇总基准并给当班阿姨推一条人数消息，
        之后仅改期与撤销实时进名单并标异动。名单只含 service_date 等于所查业务夜的预约， 06:00 一到自动切次夜；前一晚的通行情况到 /return-records 按业务夜回查。 名单联 B 的正式返宿记录显示门禁通行（已通行
        X / 共 N 人），通行不推送。
      security:
      - bearerAuth: []
      parameters:
      - name: building_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 当晚名单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingTonight'
        '403':
          description: 角色无该动作，或楼栋不在有效值班范围
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /directory/students/{student_id}/contact:
    get:
      summary: 当晚当班范围内的联系方式
      description: 动作 contact:read_duty 仅授予宿管，收件人须在该生所在楼栋此刻当班； 学生不存在与不在范围返回同一个 OUT_OF_SCOPE，避免用状态码探测名册（docs/08 字段级权限）。
      security:
      - bearerAuth: []
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 联系方式
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentContact'
        '403':
          description: 无动作权限或不在有效值班范围
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /directory/buildings/{building_id}/residents:
    get:
      summary: 现场补录用本楼栋名册检索
      description: 动作 building_residents:read_duty 仅授予宿管，用于 24:00 后按门铃返宿时手动选取学生。 在调用者当前有效值班范围内按姓名或学号（`q` 子串，二者任一命中）检索本楼栋当晚住宿学生，
        锁定姓名、学号、学院、年级、寝室等必要身份；楼栋不在值班范围一律 OUT_OF_SCOPE（R11）。 名册不含联系方式——补录只需要身份，联系方式另走 `contact:read_duty`。
      security:
      - bearerAuth: []
      parameters:
      - name: building_id
        in: path
        required: true
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: 姓名或学号子串；留空返回本楼栋当晚全量名册。
      responses:
        '200':
          description: 命中的学生身份列表（按学号升序）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentList'
        '403':
          description: 角色无该动作，或楼栋不在有效值班范围
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /return-records:
    get:
      summary: 返宿记录与二维码使用情况
      description: 唯一写入方是 B 的 returns 模块。动作 return:read_scoped 只授予辅导员与宿管： 辅导员按负责学生过滤，宿管按有效值班楼栋过滤，园区与学生 403。 service_date
        缺省取此刻所属业务夜；前一晚的情况在本页按业务夜回查。
      security:
      - bearerAuth: []
      parameters:
      - name: service_date
        in: query
        schema:
          type: string
          format: date
      - name: building_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: 当夜清单：有码的按码列，无码的人工补录也列（pass_status 为空）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRecords'
        '403':
          description: 角色无该动作，或楼栋不在有效值班范围
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /return-records/manual:
    post:
      summary: 宿管现场补录返宿
      description: 动作 manual_return:create 只授予宿管。补录与扫码共用同一唯一约束 （student_id, service_date），因此同一夜只有一条返宿事实； occurred_at
        必须在业务时区 [00:00,06:00) 内，与所声称业务夜同夜且不晚于服务端当前时间。允许白天补填历史发生时间；未填 service_date 时从 occurred_at 派生。
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - student_id
              - building_id
              properties:
                student_id:
                  type: string
                building_id:
                  type: string
                service_date:
                  type: string
                  format: date
                occurred_at:
                  type: string
                  format: date-time
                gate_id:
                  type: string
                evidence:
                  type: object
                  additionalProperties: true
                idempotency_key:
                  type: string
                  description: 同一回执重放只产生一条记录
      responses:
        '200':
          description: 正式返宿记录（重放返回同一条）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRecord'
        '403':
          description: 角色无该动作，或楼栋/学生不在有效值班范围
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 缺少字段、时间无时区或发生时间与业务夜不属于同一夜
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /duty-assignments:
    post:
      summary: 园区指派值班或代班，宿管不可自行扩权
      operationId: post_duty-assignments
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DutyAssignment'
        '403':
          description: 动作或数据范围被拒
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DutyAssignmentRequest'
    get:
      summary: 值班与代班范围
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DutyAssignmentList'
        '403':
          description: 动作、范围或输入被拒
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 宿管只列本人班次，园区列已指派班次，其他获授读取动作的角色不返回他人班次。
  /duty-assignments/switch:
    post:
      summary: 跨楼栋代班切换
      description: 园区指派代班的兼容入口；宿管不能自授跨楼栋范围。
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DutyAssignment'
        '403':
          description: 动作、范围或输入被拒
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DutyAssignmentRequest'
  /statistics:
    get:
      summary: 全校晚归统计（园区全校；辅导员/思政/学院负责人按范围收窄）
      description: 动作 statistics:read 授予园区、辅导员、思政与学院负责人。园区数据范围为全校（R14）；
        辅导员/思政限本人负责学生、学院负责人限获授学院学生，范围外记录一律不出现在聚合里（权限由后端 scope 执行，非前端隐藏）。
        可按学院、片区、楼栋、年级、培养层次、性别筛选，筛选目录同样按调用者范围收窄；人数、晚归夜数、返宿次数三值分列，
        取消、领码与未确认返宿不计实际晚归（R10、R15）。
        归属默认按业务夜发生时快照（住宿按 `residences` 生效区间、年级按年份推算）， `attribution=current` 切换为当前归属口径。 预约人数与未确认人数经共享报告读模型计算；取消不计，未确认仅表示没有匹配到正式返宿记录。
        两个日期都不传时统计「当前业务夜往前 14 个业务夜」（Demo 默认，见 `docs/13-待确认事项.md`）； 只传一个日期就是那一夜。响应里的 `range` 回显实际统计到的区间。
      operationId: get_campus_statistics
      security:
      - bearerAuth: []
      parameters:
      - name: date_from
        in: query
        description: 业务夜区间起（含）
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        description: 业务夜区间止（含）
        schema:
          type: string
          format: date
      - name: college_org_id
        in: query
        schema:
          type: string
      - name: park_org_id
        in: query
        description: 片区（organizations 的 CAMPUS_PARK 行）
        schema:
          type: string
      - name: building_id
        in: query
        schema:
          type: string
      - name: education_level
        in: query
        schema:
          $ref: '#/components/schemas/EducationLevel'
      - name: grade
        in: query
        schema:
          type: string
      - name: gender
        in: query
        schema:
          type: string
          enum:
          - MALE
          - FEMALE
      - name: return_source
        in: query
        schema:
          type: string
          enum:
          - QR
          - MANUAL
      - name: group_by
        in: query
        description: 分组维度；none 只回总计行，trend 走 by_day
        schema:
          type: string
          enum:
          - none
          - college
          - park
          - building
          - grade
          - gender
          - trend
          default: park
      - name: attribution
        in: query
        schema:
          type: string
          enum:
          - snapshot
          - current
          default: snapshot
      responses:
        '200':
          description: 三值统计 + 分组明细
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statistics'
        '403':
          description: 角色无该动作（FORBIDDEN_ACTION），或范围角色未解析出负责学生（SCOPE_UNRESOLVED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /statistics/filters:
    get:
      summary: 晚归统计筛选器选项（按调用者范围收窄）
      description: 动作 statistics:read；返回学院、片区（含楼栋数）、楼栋、年级、培养层次、性别、晚归来源的可选值。
        园区返回全校目录；辅导员/思政/学院负责人只返回其负责范围内实际存在的选项，范围外的组织结构不出现在下拉里。
        只读 `organizations`、`buildings`、`students` 的目录行，不返回个人字段。
      operationId: get_statistics_filters
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 各维度的候选值
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsOptions'
        '403':
          description: 角色无该动作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /exports:
    post:
      summary: 发起受控导出
      description: 动作 export:create 授予园区、辅导员、思政与学院负责人（R11 字段级权限）。导出内容永远是 `/statistics` 的聚合结果，
        不含学生明细，所以联系方式与身份天然不在范围内。园区导出全校；辅导员/思政/学院负责人在创建时把本人负责学生集合快照存入任务
        （`scope_student_ids`），worker 渲染只导该快照内的学生，之后负责关系变更不影响这次导出。
        `params.date_from/date_to` 必须显式给出， 审计要能回答「导的是哪几夜」。接口只登记任务并排队 EXPORT_BUILD，渲染由 worker 完成，
        因此 201 返回的资源通常是 PENDING；同一用户、同一角色范围及参数的同一 `idempotency_key` 重复提交返回同一任务。
        同一用户重复使用键但参数或角色范围改变时返回 409 IDEMPOTENCY_CONFLICT；其他用户的键返回 404，不泄露任务。
        需要重新生成最新数据时使用新键。CSV 仅含既有六项聚合指标，数据缺口说明取实际查询结果。
      operationId: create_campus_export
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '404':
          description: 幂等键属于其他用户（EXPORT_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 同一幂等键的参数或角色范围不一致（IDEMPOTENCY_CONFLICT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '201':
          description: 任务已登记（PENDING），完成后 same export_id 可下载
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '403':
          description: 角色无该动作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 口径非法（缺区间、未知键、report 不支持），创建即拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: 本人的导出任务
      description: 只列当前用户发起的任务，新的在前；超过保留期的行内容已清空，`downloadable=false`。
      operationId: list_campus_exports
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 导出任务列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobList'
        '403':
          description: 角色无该动作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /exports/{export_id}:
    delete:
      summary: 删除本人的导出记录和文件
      description: 动作 export:delete；只允许发起人。清空文件并从本人列表、详情和下载隐藏，后台任务审计保留。排队和生成中同样可删除，worker 不得恢复文件；重复删除返回同一成功结果。不存在或他人任务 404。
      operationId: delete_export
      security:
      - bearerAuth: []
      parameters:
      - name: export_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                required: [export_id, deleted]
                properties:
                  export_id:
                    type: string
                  deleted:
                    type: boolean
                    const: true
        '403':
          description: 无 export:delete 动作权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: EXPORT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: 导出任务状态
      description: 只有发起人能查到自己的任务；不存在或不属于本人统一返回 404，不泄露他人任务。
      operationId: get_campus_export
      security:
      - bearerAuth: []
      parameters:
      - name: export_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 任务资源
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '403':
          description: 角色无该动作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: EXPORT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /exports/{export_id}/download:
    get:
      summary: 下载导出 CSV
      description: UTF-8 带 BOM 的 CSV，首列为分组维度的展示名，其后固定人数、晚归夜数、返宿次数、 扫码返宿次数、人工补录次数、在册人数；预约与未确认两列因来源未落地而不进文件。 生成中或失败返回
        409，内容已过保留期返回 410。
      operationId: download_campus_export
      security:
      - bearerAuth: []
      parameters:
      - name: export_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 带 UTF-8 BOM（EF BB BF）的 CSV 文件；浏览器须原样保存响应字节，避免文本解码丢失 BOM 后 Excel 误判中文编码。
          content:
            text/csv:
              schema:
                type: string
        '403':
          description: 角色无该动作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: EXPORT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: EXPORT_NOT_READY 或 EXPORT_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: EXPORT_EXPIRED，超过 EXPORT_RETENTION_DAYS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /device/scan:
    post:
      summary: 模拟终端扫码核销
      description: 独立设备身份；成功回执才产生正式返宿。失败不产生记录，未知保持占用并由 worker 查询模拟网关对账，不恢复旧码。
      parameters:
      - name: x-device-id
        in: header
        required: true
        schema:
          type: string
      - name: x-device-token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  description: 二维码令牌明文，服务端只按摘要匹配
                result:
                  type: string
                  enum:
                  - SUCCEEDED
                  - FAILED
                  - UNKNOWN
                  default: SUCCEEDED
                reconcile_result:
                  type: string
                  enum:
                  - SUCCEEDED
                  - FAILED
                  default: SUCCEEDED
      responses:
        '200':
          description: 放行或重复扫码
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanAttempt'
        '401':
          description: DEVICE_UNKNOWN / DEVICE_UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: GATE_MISMATCH / NIGHT_ACCESS_ENDED，门禁或时段不符
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: PASS_REVOKED / PASS_CONSUMED / RETURN_EXISTS，改期作废或当夜名额已被占用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
