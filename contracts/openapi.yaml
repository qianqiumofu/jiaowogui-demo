      - recipient_user_ids
      properties:
        template:
          $ref: '#/components/schemas/ManualNotificationTemplate'
        service_date:
          type: string
          format: date
          description: 省略时取服务端当前业务夜（客户端不得自行判定跨日）。
        recipient_user_ids:
          type: array
          minItems: 1
