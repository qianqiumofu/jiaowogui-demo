[project]
name = "jiaowogui-api"
version = "0.0.0"
description = "Dorm night-return management demo API"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.163.1",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.3",
  "sqlalchemy==2.1.8",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.9",
  "tzdata==2026.6",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
