          - FULFILLED
          - CLOSED
          - NONE
        reservation_version:
          type:
          - integer
          - 'null'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
        change_flag:
          oneOf:
          - $ref: '#/components/schemas/ChangeFlag'
          - type: 'null'
        return_status:
          type: string
          description: PENDING 未通行，ENTERED 二维码核销放行，MANUAL_ENTERED 宿管人工补录。
          enum:
          - PENDING
          - ENTERED
          - MANUAL_ENTERED
        entered_at:
          type:
          - string
          - 'null'
          format: date-time
        gate_id:
          type:
          - string
          - 'null'
        return_source:
          type:
          - string
          - 'null'
          enum:
          - QR
          - MANUAL
          - null
