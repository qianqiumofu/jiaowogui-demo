      - CANCELLED
      - ADDED_AFTER_SUMMARY
    TonightItem:
      type: object
      required:
      - student_id
      - school_id
      - display_name
      - room_no
      - planned_return_at
      - reservation_status
      - return_status
      description: 名单不含联系方式；点开发消息时另走 /directory/students/{student_id}/contact。 通行情况只来自 B 的正式返宿记录（R10）：reservation_status=FULFILLED
        不等于已返宿。 现场补录的按门铃学生没有预约，作为新行出现：`reservation_status=NONE`、 `planned_return_at` 取该条人工补录记录的返宿时刻（录入时刻），并标 `ADDED_AFTER_SUMMARY`。
        已被补录的、本就有预约的学生仍走预约行（晚归时间保留预约时间），不重复成两条。
