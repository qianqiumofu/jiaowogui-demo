  /notification-dispatch:
    post:
      summary: 演示投递：按模板渲染并入队通知任务
      description: 仅园区角色（notification:dispatch）。这是演示用的手动入口：正式版的收件人由服务端按目录与 值班关系派生（23:30 名单 → 当班宿管；日报周报 → 负责辅导员；风险预警
        → 辅导员 + 当班宿管）， 在 B 的目录与 duty 落地前不开放自选收件人。 服务端强制三条边界：园区不作为风险预警收件人（R16）、模板与收件人角色不匹配拒绝、 同一（模板 + 业务夜 + 收件人集合）重复提交不再入队。正文一律不含超时未返宿提醒（R15）。
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationDispatchRequest'
      responses:
        '202':
          description: 已入队的任务（去重时返回既有任务）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDispatchResult'
        '403':
          description: 非园区角色，或收件人含园区的风险预警
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 收件人不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 收件人为空或模板与收件人角色不匹配
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
