          - WEEK
          - MONTH
          default: DAY
      - name: college_org_id
        in: query
        schema:
          type: string
      - name: grade
        in: query
        schema:
          type: string
      - name: park_org_id
        in: query
        schema:
          type: string
      - name: building_id
        in: query
        schema:
          type: string
      - name: dataset
        in: query
        required: true
        schema:
          type: string
          enum:
          - RETURNED
          - RESERVED
          - REPEATED
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolStatisticsStudentList'
        '403':
          description: 无权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 周期、筛选或游标无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /statistics/quick:
    get:
      summary: 今日、本周、本月快捷人数统计（园区全校；辅导员/思政/学院负责人按范围收窄）
      description: statistics:read + SessionContext.scope。园区全校授权；辅导员/思政限本人负责学生、学院负责人限获授学院学生，范围外一律不计。DAY 分昨夜正式晚归与今夜非取消预约；周/月按最近已结束夜所在自然周/月起点至该夜。服务端判定日期，仅返回人数不返回名单。
      security:
      - bearerAuth: []
      parameters:
      - name: period
        in: query
        schema:
          type: string
          enum:
          - DAY
          - WEEK
          - MONTH
          default: DAY
      - name: college_org_id
        in: query
        schema:
          type: string
      - name: education_level
        in: query
        schema:
          $ref: '#/components/schemas/EducationLevel'
      - name: grade
        in: query
        schema:
          type: string
      - name: park_org_id
        in: query
        schema:
          type: string
      - name: building_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolOverview'
        '403':
          description: 无权或范围未解析
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 周期或筛选无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /risk-events/{event_id}/follow-up:
    post:
      summary: 追加人工跟进记录，保持跟进中
      description: require(risk:follow_up) + SessionContext.scope，仅负责COUNSELOR/IDEOLOGY和当班DORM_MANAGER。须先接手；说明1—500字符，idempotency_key用于重复请求去重，同键不同说明409。管理身份只读；通知发送不算跟进。
      security:
      - bearerAuth: []
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskFollowUpRequest'
      responses:
        '200':
          description: 跟进记录已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskEvent'
        '403':
          description: 角色无权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 事件不在负责范围
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 未接手、已办结或幂等冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 说明或幂等键无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /campus/night-summary:
    get:
      summary: 园区按楼栋查看业务夜汇总与负责人
      description: 沿用campus:query与园区范围。只读不推送；未汇总人数为null。负责人取冻结值，旧快照缺字段返回UNAVAILABLE，未汇总返回LIVE。
      security:
      - bearerAuth: []
      parameters:
      - name: service_date
        in: query
        schema:
          type: string
          format: date
      - name: park_org_id
        in: query
        schema:
          type: string
      - name: building_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampusNightSummary'
        '403':
          description: 无权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 日期或筛选无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ReservationId:
      name: reservation_id
      in: path
      required: true
      schema:
        type: string
    StaffAccountId:
      name: staff_account_id
      in: path
      required: true
      schema:
        type: string
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
    ServiceDate:
      name: service_date
      in: query
      required: false
      description: 业务日 YYYY-MM-DD（D 日 06:00 到 D+1 日 06:00 算同一夜）。缺省为服务端当前时刻的前一晚； 晚于服务端判定的当前业务日返回 422，客户端不得自行推算业务日归属。
      schema:
        type: string
        format: date
  schemas:
    AgentStatus:
      type: object
      required: [enabled, provider, message]
      properties:
        enabled:
          type: boolean
        provider:
          type: string
          enum: [DISABLED, OPENAI_COMPATIBLE]
        message:
          type: string
    AgentRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1000
        previous_messages:
          type: array
          maxItems: 4
          items:
            type: string
            minLength: 1
            maxLength: 1000
    AgentSource:
      type: object
      required: [source_id, period, window, date_from, date_to, totals]
      properties:
        source_id:
          type: string
        period:
          type: string
          enum: [DAY, WEEK, MONTH]
        window:
          type: string
          enum: [CURRENT, PREVIOUS]
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        totals:
          type: object
          required: [people, nights, returns, qr_returns, manual_returns, enrolled]
          additionalProperties:
            type: integer
            minimum: 0
          properties:
            people:
              type: integer
            nights:
              type: integer
            returns:
              type: integer
            qr_returns:
              type: integer
            manual_returns:
              type: integer
            enrolled:
              type: integer
    AgentReport:
      type: object
      required: [run_id, answer, sources, tool_steps, generated_at, notes]
      properties:
        run_id:
          type: string
        answer:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AgentSource'
        tool_steps:
          type: array
          items:
            type: object
            required: [tool, source_id]
            properties:
              tool:
                type: string
              source_id:
                type: string
        generated_at:
          type: string
          format: date-time
        notes:
          type: array
          items:
            type: string
    Role:
      type: string
      enum:
      - STUDENT
      - DORM_MANAGER
      - COUNSELOR
      - IDEOLOGY
      - TEACHER
      - COLLEGE_ADMIN
      - AUTH_ADMIN
      - CAMPUS
      description: 基础学生/教师身份由学校确认；COUNSELOR、IDEOLOGY、COLLEGE_ADMIN、CAMPUS 由上级部门授予；AUTH_ADMIN 仅由合成启动配置提供。
    AccountSource:
      type: string
      description: 账号来源。UNIFIED_SCHOOL 走学校统一身份并带校内邮箱； STAFF_LOCAL 是园区为本系统注册的雇佣人员工号账号，无邮箱，通知只走站内待办。
      enum:
      - UNIFIED_SCHOOL
      - STAFF_LOCAL
    StaffAccountStatus:
      type: string
      enum:
      - ACTIVE
      - DISABLED
    DemoAccount:
      type: object
      required:
      - user_id
      - login_name
      - display_name
      - roles
      - password
      - account_source
      properties:
        user_id:
          type: string
          description: 合成账号的稳定 ID；园区端用它指定演示投递的收件人。
        login_name:
          type: string
        display_name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        password:
          type: string
          description: 仅 Demo 合成口令
        account_source:
          $ref: '#/components/schemas/AccountSource'
        email:
          type:
          - string
          - 'null'
          description: 合成校内邮箱；工号账号为 null。
    Scope:
      type: object
      description: '数据范围，按角色出现不同字段；resolved_by 标明由哪个适配器解析， pending: 前缀表示等待 B 目录模块覆盖。'
      required:
      - resolved_by
      additionalProperties: true
      properties:
        student_id:
          type:
          - string
          - 'null'
        counselor_user_id:
          type: string
        student_ids:
          type: array
          items:
            type: string
        building_ids:
          type: array
          items:
            type: string
        scope:
          type: string
          description: 园区授权标记，如 ALL_AUTHORIZED
        resolved_by:
          type: string
        college_org_ids:
          type: array
          items:
            type: string
    SessionContext:
      type: object
      required:
      - session_id
      - user_id
      - school_id
      - display_name
      - roles
      - active_role
      - scope
      - expires_at
      - account_source
      properties:
        session_id:
          type: string
        user_id:
          type: string
        school_id:
          type: string
          description: 校内统一账户为学号或工号；工号账号为本地工号，与校内编号无关。
        display_name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        active_role:
          $ref: '#/components/schemas/Role'
        scope:
          $ref: '#/components/schemas/Scope'
        expires_at:
          type: string
          format: date-time
        account_source:
          $ref: '#/components/schemas/AccountSource'
        email:
          type:
          - string
          - 'null'
          description: 报告与预警邮件的投递地址；STAFF_LOCAL 为 null，只落站内待办。
        identity_types:
          type: array
          items:
            type: string
            enum:
            - STUDENT
            - TEACHER
            - EMPLOYEE
        college_org_id:
          type:
          - string
          - 'null'
        position_title:
          type: string
    StaffAccount:
      type: object
      required:
      - id
      - login_name
      - display_name
      - building_ids
      - status
      - created_at
      properties:
        id:
          type: string
        login_name:
          type: string
        display_name:
          type: string
        building_ids:
          type: array
          description: 园区绑定的固定管理楼栋；代班（B 的 duty）在此之上叠加。
          items:
            type: string
        status:
          $ref: '#/components/schemas/StaffAccountStatus'
        created_at:
          type: string
          format: date-time
        disabled_at:
          type:
          - string
          - 'null'
          format: date-time
    StaffAccountCreateRequest:
      type: object
      required:
      - login_name
      - display_name
      - building_ids
      properties:
        login_name:
          type: string
          minLength: 3
          description: 不得与统一账户或已有工号账号重复。
        display_name:
          type: string
          minLength: 1
        building_ids:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
    StaffAccountUpdateRequest:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
        building_ids:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
    StaffAccountSecret:
      type: object
      description: 只在创建与重置响应中出现一次，不写日志、不进列表接口。
      required:
      - account
      - initial_password
      properties:
        account:
          $ref: '#/components/schemas/StaffAccount'
        initial_password:
          type: string
    StaffAccountList:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffAccount'
        next_cursor:
          type:
          - string
          - 'null'
    AuthSession:
      type: object
      required:
      - token
      - session
      properties:
        token:
          type: string
        session:
          $ref: '#/components/schemas/SessionContext'
    LogoutResult:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - logged_out
    AllowedActions:
      type: object
      required:
      - role
      - allowed_actions
      properties:
        role:
          $ref: '#/components/schemas/Role'
        allowed_actions:
          type: array
          items:
            type: string
    ScopeCheck:
      type: object
      required:
      - role
      - action
      - decision
      - scope
      properties:
        role:
          $ref: '#/components/schemas/Role'
        action:
          type: string
        decision:
          type: string
          enum:
          - ALLOWED
        scope:
          $ref: '#/components/schemas/Scope'
    RoleList:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - value
            properties:
              value:
                $ref: '#/components/schemas/Role'
        next_cursor:
          type:
          - string
          - 'null'
    ClockState:
      type: object
      required:
      - now
      - service_date
      - night_window
      - latest_return_at
      - offset_minutes
      properties:
        now:
          type: string
          format: date-time
        service_date:
          type: string
          format: date
          description: 服务端判定的当前业务夜 D（[D 06:00, D+1 06:00)），供客户端构造当夜时间。
        night_window:
          type: array
          description: 当夜门禁时段 [start, end)，端点带时区；客户端只用它列举可选时刻，不自行判定。
          items:
            type: string
            format: date-time
          minItems: 2
          maxItems: 2
        latest_return_at:
          type: string
          format: date-time
          description: 最晚可选返宿时刻（门禁结束前一个核验窗口，默认 05:30），端点带时区；客户端列举返宿档位以此为含上界，保证核验窗口不越过 06:00。
        offset_minutes:
          type: integer
    ReservationStatus:
      type: string
      enum:
      - ACTIVE
      - CANCELLED
      - FULFILLED
      - CLOSED
    VerificationState:
      type: string
      enum:
      - NOT_OPEN
      - OPEN
      - ENDED
      description: 相对服务端读取时刻的核验窗口位置（R08，端点包含）。
    ReservationVerification:
      type: object
      description: 预约派生出的核验时段视图（R08、R09）。窗口＝预约时刻前后 margin_minutes，端点包含； 核验可以发生在零点前，但夜间通行只在 [00:00,06:00) 内有效， 所以
        state 与能否通行是两件事。客户端只显示，不自行判断（基线「统一日期与边界」）。
      required:
      - opens_at
      - closes_at
      - state
      - margin_minutes
      - code_seconds
      - night_access_ends_at
      properties:
        opens_at:
          type: string
          format: date-time
        closes_at:
          type: string
          format: date-time
        state:
          $ref: '#/components/schemas/VerificationState'
        margin_minutes:
          type: integer
          description: 前后裕量，配置 verification_margin_minutes（基线 R08 已确认 30）。
        code_seconds:
          type: integer
          description: 二维码完整秒数，配置 pass_code_seconds（基线 R09 已确认 300）。
        night_access_ends_at:
          type: string
          format: date-time
          description: 该业务夜夜间授权结束时刻（06:00）；窗口上界可以越过它，码到点即 NIGHT_ACCESS_ENDED。
    Reservation:
      type: object
      description: 一晚一条；(student_id, service_date) 唯一。version 从 1 起，每次学生动作 +1； 系统关闭（CLOSED）不加 version。修改/取消/恢复必须携带
        expected_version。
      required:
      - id
      - student_id
      - service_date
      - status
      - planned_return_at
      - reason
      - version
      - created_at
      - updated_at
      - verification
      properties:
        id:
          type: string
        student_id:
          type: string
        service_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ReservationStatus'
        planned_return_at:
          type: string
          format: date-time
          description: 必须落在该业务夜门禁时段 [D+1 00:00, 06:00)，服务端判定。
        reason:
          type: string
          description: 自由文本，上限 500 字符（Demo 默认）；不作为拒绝依据（R06、R17）。
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        verification:
          $ref: '#/components/schemas/ReservationVerification'
        risk_notice:
          allOf:
          - $ref: '#/components/schemas/RiskNotice'
          description: 仅 POST 响应在「本次预约首次跨过演示阈值」时返回；其余入口与未触发时缺省。 判定与文案全部在服务端，客户端只显示（基线「统一日期与边界」）。
    ReservationRevisionSource:
      type: string
      enum:
      - CREATE
      - RESCHEDULE
      - CANCEL
      - RESTORE
      - CLOSE
    ReservationRevision:
      type: object
      description: 只追加的修订历史；CREATE 记录 version=1 的初始内容。
      required:
      - id
      - reservation_id
      - version
      - source
      - status
      - planned_return_at
      - reason
      - changed_at
      properties:
        id:
          type: string
        reservation_id:
          type: string
        version:
          type: integer
        source:
          $ref: '#/components/schemas/ReservationRevisionSource'
        status:
          $ref: '#/components/schemas/ReservationStatus'
        planned_return_at:
          type: string
          format: date-time
        reason:
          type: string
        changed_by:
          type:
          - string
          - 'null'
          description: 学生 user_id；CLOSE 等系统事件为 null
        changed_at:
          type: string
          format: date-time
    ReservationList:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Reservation'
        next_cursor:
          type:
          - string
          - 'null'
    RevisionList:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReservationRevision'
        next_cursor:
          type:
          - string
          - 'null'
    RiskNotice:
      type: object
      description: 申请时弹窗的规则事实（R16）。口径是「预约晚归的业务夜数与连续性」， 不是实际晚归——实际返宿以门禁通行记录为准，B 的记录模块落地前不改口径。 阈值全部来自演示配置，正式值待学校确认，正文不得写成处分或催办（R15、R17）。
      required:
      - rule_version
      - window_nights
      - nights
      - times
      - consecutive_nights
      - title
      - message
      properties:
        rule_version:
          type: string
          description: 触发所用的规则集版本，配置 risk_rule_version；同一夜重复弹窗判定必须比对它。
        window_nights:
          type: integer
          description: 统计窗口（业务夜数），配置 risk_window_nights
        nights:
          type: array
          items:
            type: string
            format: date
          description: 窗口内出现非取消预约的业务夜，升序，含当夜。
        times:
          type: integer
          description: 窗口内的晚归夜数
        consecutive_nights:
          type: integer
          description: 窗口内最长的连续晚归夜数
        triggered_by:
          type: string
          enum:
          - TIMES
          - CONSECUTIVE
          description: 首先越过的阈值；两者同时越界时取 TIMES。
        title:
          type: string
        message:
          type: string
          description: 服务端渲染好的提示正文，客户端原样显示，不参与判定与拼接。
    NotificationTemplate:
      type: string
      description: NIGHT_ROSTER 每晚 24:00 宿管名单快照（R12）；DAILY_REPORT 次日辅导员日报、 WEEKLY_REPORT 周一辅导员周报（R13）；RISK_ALERT
        多次或连续触发的跟进提示（R16）， 收件人只能是负责辅导员与当班宿管。
      enum:
      - NIGHT_ROSTER
      - DAILY_REPORT
      - WEEKLY_REPORT
      - RISK_ALERT
      - DORM_APPROVED
      - DORM_RESCHEDULED
