          type: string
          description: 发起人 user_id，只有本人能列出与下载
        params:
          type: object
          additionalProperties: true
        file_name:
          type:
          - string
          - 'null'
        row_count:
          type:
          - integer
          - 'null'
          description: CSV 数据行数，不含口径说明与合计行
        error:
          type:
          - string
          - 'null'
        idempotency_key:
          type:
