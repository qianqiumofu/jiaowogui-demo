    ExportRequest:
      type: object
      required:
      - report
      - params
      properties:
        report:
          type: string
          enum:
          - STATISTICS
          description: 受控导出的唯一口径来源；明细导出未开放
        params:
          type: object
          description: 与 `/statistics` 完全同一套口径参数，未知键在创建时就被拒绝。 `date_from`、`date_to` 必填；`group_by` 缺省 park，`attribution`
            缺省 snapshot。
          required:
          - date_from
          - date_to
          properties:
            date_from:
              type: string
              format: date
            date_to:
              type: string
              format: date
            college_org_id:
              type: string
            park_org_id:
              type: string
            building_id:
              type: string
            education_level:
              $ref: '#/components/schemas/EducationLevel'
            grade:
              type: string
            gender:
              type: string
              enum:
              - MALE
              - FEMALE
            return_source:
              type: string
              enum:
              - QR
              - MANUAL
            group_by:
              type: string
              enum:
              - none
              - college
              - park
              - building
              - grade
              - gender
              - trend
            attribution:
              type: string
              enum:
              - snapshot
              - current
        idempotency_key:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
          description: 同一用户同一参数与范围的同一键返回原任务；参数或范围不同时 409。重新生成使用新键。
    ExportJob:
      type: object
      required:
      - export_id
      - report
      - status
      - requested_by
      - params
      - created_at
      - updated_at
      - downloadable
      - file_name
      - row_count
      - error
      - idempotency_key
      - done_at
      - expires_at
