openapi: 3.1.0
info:
  title: 交我归 Demo API
  version: 0.1.0
  description: >-
    两人共用契约。规则以业务规则基线为唯一来源；字段 snake_case，枚举大写字符串，
    时间带时区，ID 为不透明字符串。列表响应统一 items/next_cursor，成功响应直接返回对象本身，
    错误响应统一 code/message/request_id/details。

servers:
  - url: http://localhost:8000/api/v1

paths:
  /auth/demo-accounts:
    get:
      summary: 列出合成登录账号
      responses:
        "200":
          description: 账号列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemoAccount"

  /auth/mock-login:
    post:
      summary: 模拟学校统一身份登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_name, password]
              properties:
                login_name: { type: string }
                password: { type: string }
      responses:
        "200":
          description: 会话令牌与上下文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: 口令错误或账号不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /me:
    get:
      summary: 当前会话上下文
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 上下文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionContext"
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/role-switch:
    post:
      summary: 切换到该账号已被授予的另一角色
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: 新会话令牌（旧令牌立即失效）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "403":
          description: 该账号未被授予此角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      summary: 退出并销毁会话
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 已退出
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResult"

  /authz/actions:
    get:
      summary: 当前角色可执行动作
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 动作清单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowedActions"

  /authz/scope-check:
    get:
      summary: 检查当前会话对某动作的授权与数据范围
      security: [{ bearerAuth: [] }]
      parameters:
        - name: action
          in: query
          schema: { type: string, default: "reservation:create" }
      responses:
        "200":
          description: 允许时返回角色、动作与范围
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeCheck"
        "403":
          description: 动作未授予或范围无法解析
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /authz/roles:
    get:
      summary: 系统角色枚举列表
      responses:
        "200":
          description: 角色列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"

  /reservations:
    get:
      summary: 按授权范围列出预约
      description: >-
        学生返回本人当夜及历史预约；辅导员与宿管在目录关系落地前返回
        SCOPE_UNRESOLVED，不得返回空列表伪装成「没有预约」。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: service_date
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: 预约列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationList"
        "403":
          description: 角色未授予 reservation:read，或范围依赖的目录关系未落地
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: 创建当日晚归预约
      description: >-
        service_date 由服务端时钟判定为当夜，客户端不可指定其他夜晚（R05）。
        全部自动通过（R06）。当夜已存在 ACTIVE/FULFILLED 预约返回
        RESERVATION_EXISTS；存在 CANCELLED 预约返回 RESERVATION_CANCELLED，
        须走恢复接口复用同一 ID。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planned_return_at]
              properties:
                planned_return_at: { type: string, format: date-time }
                reason: { type: string, maxLength: 500 }
      responses:
        "201":
          description: 已创建并自动通过
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "409":
          description: 当夜已有预约或需走恢复
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reservations/tonight:
    get:
      summary: 当前业务夜的本人预约（服务端判定 service_date）
      description: >-
        供学生端使用，避免客户端推算业务日；无预约时返回 null。
        仅学生角色可用。
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 预约对象或 null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Reservation"
                  - type: "null"

  /reservations/{reservation_id}:
    patch:
      summary: 改期或修改原因（次数不限）
      description: >-
        R07：不受原预约时间窗口约束，可改到本业务夜门禁时段内任意时间；
        已返宿（FULFILLED）或业务夜已结束（CLOSED）返回 409
        RESERVATION_NOT_EDITABLE。expected_version 过期返回 409 VERSION_CONFLICT。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
                expected_version: { type: integer }
                planned_return_at: { type: string, format: date-time }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: 更新后的预约
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: 预约不存在或不属于当前范围
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 版本冲突或当前状态不可修改
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reservations/{reservation_id}/cancel:
    post:
      summary: 取消预约
      description: 已返宿（FULFILLED）或业务夜结束（CLOSED）不可取消。取消保留 ID 供恢复。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
                expected_version: { type: integer }
      responses:
        "200":
          description: 取消后的预约
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: 预约不存在或不属于当前范围
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 版本冲突或当前状态不可取消
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reservations/{reservation_id}/restore:
    post:
      summary: 恢复已取消的当夜预约（复用同一 ID）
      description: 基线「取消后恢复同一预约 ID，不能新建第二条」；仅 CANCELLED 可恢复。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
                expected_version: { type: integer }
      responses:
        "200":
          description: 恢复后的预约
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: 预约不存在或不属于当前范围
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 版本冲突或当前状态不可恢复
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reservations/{reservation_id}/revisions:
    get:
      summary: 预约修订历史（只追加）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: 按 version 升序的修订记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionList"
        "404":
          description: 预约不存在或不属于当前范围
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /risk-events:
    get:
      summary: 按授权范围列出风险事件
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemList"
        "403":
          description: 无权或负责关系缺失
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /buildings/{building_id}/tonight:
    get:
      summary: 宿管当晚名单
      security: [{ bearerAuth: [] }]
      parameters:
        - name: building_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "501":
          description: 能力未实现
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /return-records:
    get:
      summary: 正式返宿记录（唯一写入方为 B）
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemList"

  /duty-assignments:
    get:
      summary: 值班与代班范围
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemList"

  /duty-assignments/switch:
    post:
      summary: 跨楼栋代班切换
      description: 动作 duty:switch 仅授予宿管；生效区间与值班范围校验在 M1 冻结。
      security: [{ bearerAuth: [] }]
      responses:
        "403":
          description: 当前角色未被授予 duty:switch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: 能力未实现
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /device/scan:
    post:
      summary: 模拟终端扫码核销
      description: 使用设备身份认证，不使用学生会话；契约细节在 M3 冻结。
      responses:
        "501":
          description: 能力未实现
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /demo/clock:
    get:
      summary: 读取演示时钟
      responses:
        "200":
          description: 当前业务时间、服务端判定的业务夜与偏移分钟数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockState"
    post:
      summary: 推进演示时钟
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offset_minutes]
              properties:
                offset_minutes: { type: integer }
      responses:
        "200":
          description: 新的业务时间
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockState"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    ReservationId:
      name: reservation_id
      in: path
      required: true
      schema: { type: string }

  schemas:
    Role:
      type: string
      enum: [STUDENT, DORM_MANAGER, COUNSELOR, CAMPUS]

    DemoAccount:
      type: object
      required: [login_name, display_name, roles, password]
      properties:
        login_name: { type: string }
        display_name: { type: string }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        password: { type: string, description: 仅 Demo 合成口令 }

    Scope:
      type: object
      description: >-
        数据范围，按角色出现不同字段；resolved_by 标明由哪个适配器解析，
        pending: 前缀表示等待 B 目录模块覆盖。
      required: [resolved_by]
      additionalProperties: true
      properties:
        student_id: { type: ["string", "null"] }
        counselor_user_id: { type: string }
        student_ids:
          type: array
          items: { type: string }
        building_ids:
          type: array
          items: { type: string }
        scope: { type: string, description: 园区授权标记，如 ALL_AUTHORIZED }
        resolved_by: { type: string }

    SessionContext:
      type: object
      required:
        [session_id, user_id, school_id, display_name, roles, active_role, scope, expires_at]
      properties:
        session_id: { type: string }
        user_id: { type: string }
        school_id: { type: string }
        display_name: { type: string }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        active_role: { $ref: "#/components/schemas/Role" }
        scope: { $ref: "#/components/schemas/Scope" }
        expires_at: { type: string, format: date-time }

    AuthSession:
      type: object
      required: [token, session]
      properties:
        token: { type: string }
        session: { $ref: "#/components/schemas/SessionContext" }

    LogoutResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [logged_out] }

    AllowedActions:
      type: object
      required: [role, allowed_actions]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        allowed_actions:
          type: array
          items: { type: string }

    ScopeCheck:
      type: object
      required: [role, action, decision, scope]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        action: { type: string }
        decision: { type: string, enum: [ALLOWED] }
        scope: { $ref: "#/components/schemas/Scope" }

    RoleList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
            required: [value]
            properties:
              value: { $ref: "#/components/schemas/Role" }
        next_cursor: { type: ["string", "null"] }

    ClockState:
      type: object
      required: [now, service_date, offset_minutes]
      properties:
        now: { type: string, format: date-time }
        service_date:
          type: string
          format: date
          description: 服务端判定的当前业务夜 D（[D 06:00, D+1 06:00)），供客户端构造当夜时间。
        offset_minutes: { type: integer }

    ReservationStatus:
      type: string
      enum: [ACTIVE, CANCELLED, FULFILLED, CLOSED]

    Reservation:
      type: object
      description: >-
        一晚一条；(student_id, service_date) 唯一。version 从 1 起，每次学生动作 +1；
        系统关闭（CLOSED）不加 version。修改/取消/恢复必须携带 expected_version。
      required:
        [id, student_id, service_date, status, planned_return_at, reason,
         version, created_at, updated_at]
      properties:
        id: { type: string }
        student_id: { type: string }
        service_date: { type: string, format: date }
        status: { $ref: "#/components/schemas/ReservationStatus" }
        planned_return_at:
          type: string
          format: date-time
          description: 必须落在该业务夜门禁时段 [D+1 00:00, 06:00)，服务端判定。
        reason:
          type: string
          description: 自由文本，上限 500 字符（Demo 默认）；不作为拒绝依据（R06、R17）。
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReservationRevisionSource:
      type: string
      enum: [CREATE, RESCHEDULE, CANCEL, RESTORE, CLOSE]

    ReservationRevision:
      type: object
      description: 只追加的修订历史；CREATE 记录 version=1 的初始内容。
      required:
        [id, reservation_id, version, source, status, planned_return_at, reason, changed_at]
      properties:
        id: { type: string }
        reservation_id: { type: string }
        version: { type: integer }
        source: { $ref: "#/components/schemas/ReservationRevisionSource" }
        status: { $ref: "#/components/schemas/ReservationStatus" }
        planned_return_at: { type: string, format: date-time }
        reason: { type: string }
        changed_by: { type: ["string", "null"], description: 学生 user_id；CLOSE 等系统事件为 null }
        changed_at: { type: string, format: date-time }

    ReservationList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Reservation" }
        next_cursor: { type: ["string", "null"] }

    RevisionList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReservationRevision" }
        next_cursor: { type: ["string", "null"] }

    ItemList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { type: object, additionalProperties: true }
        next_cursor: { type: ["string", "null"] }

    Error:
      type: object
      required: [code, message, request_id, details]
      properties:
        code:
          type: string
          description: >-
            错误码。已使用：UNAUTHENTICATED, BAD_CREDENTIALS, SESSION_INVALID,
            SUBJECT_NOT_FOUND, FORBIDDEN_ACTION, ROLE_NOT_ASSIGNED, SCOPE_UNRESOLVED,
            DATABASE_UNAVAILABLE, NOT_IMPLEMENTED, VALIDATION_FAILED, INTERNAL_ERROR,
            VERSION_CONFLICT, RESERVATION_EXISTS, RESERVATION_CANCELLED,
            RESERVATION_NOT_EDITABLE, RESERVATION_NOT_FOUND。
            新增错误码必须同时更新文档与前端处理。
        message: { type: string }
        request_id: { type: string }
        details: { type: object, additionalProperties: true }
