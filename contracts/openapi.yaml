      type: string
      description: 24:00 汇总之后的异动。RESCHEDULED 是改期、CANCELLED 是撤销，均按 R07/R12 允许； ADDED_AFTER_SUMMARY 只可能来自越权或跨夜异常，用于对账，不代表申请被放行。
      enum:
