          type: string
          format: date-time
        done_at:
          type:
          - string
          - 'null'
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: done_at + EXPORT_RETENTION_DAYS；到期后内容清空，任务行留作审计
